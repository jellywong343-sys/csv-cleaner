[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-cleaner"
version = "1.0.0"
description = "Trim cells, remove empty rows, and deduplicate CSV data using only the Python standard library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GitHub Content Pack Contributor" }]
dependencies = []
keywords = ["python", "cli", "csv", "data-cleaning", "automation"]

[project.scripts]
csv-clean = "csv_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
